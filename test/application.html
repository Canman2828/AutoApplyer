<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Software Engineering Intern — Summer 2027 | Acme Corp Careers</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 680px; margin: 0 auto; padding: 32px 20px; color: #222; }
    h1 { font-size: 22px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 18px 0; padding: 14px 18px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: block; margin: 10px 0 2px; font-size: 13px; font-weight: 600; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="url"],
    input[type="date"], input[type="month"], select, textarea {
      width: 100%; padding: 7px 9px; border: 1px solid #bbb; border-radius: 5px; font: 14px system-ui; box-sizing: border-box;
    }
    .radio-group label, .checkline { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin-right: 18px; }
    button { margin-top: 18px; padding: 10px 26px; background: #0a66c2; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Software Engineering Intern — Summer 2027</h1>
  <p>Acme Corp · Remote / San Francisco, CA</p>

  <form id="app">
    <fieldset>
      <legend>Personal Information</legend>
      <label for="first">First Name *</label>
      <input id="first" name="first_name" type="text" required />
      <label for="last">Last Name *</label>
      <input id="last" name="last_name" type="text" required />
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
      <label for="phone">Phone *</label>
      <input id="phone" name="phone" type="tel" required />
      <label for="city">City</label>
      <input id="city" name="city" type="text" />
      <label for="state">State</label>
      <select id="state" name="state">
        <option value=""></option>
        <option value="AL">Alabama</option>
        <option value="CA">California</option>
        <option value="GA">Georgia</option>
        <option value="NY">New York</option>
        <option value="TX">Texas</option>
      </select>
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value=""></option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="GB">United Kingdom</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Links</legend>
      <label for="linkedin">LinkedIn Profile</label>
      <input id="linkedin" name="linkedin" type="url" />
      <label for="github">GitHub Profile</label>
      <input id="github" name="github" type="url" />
    </fieldset>

    <fieldset>
      <legend>Education</legend>
      <label for="school">School / University *</label>
      <input id="school" name="school" type="text" required />
      <label for="degree">Degree</label>
      <select id="degree" name="degree">
        <option value=""></option>
        <option value="hs">High School Diploma</option>
        <option value="bs">Bachelor of Science</option>
        <option value="ba">Bachelor of Arts</option>
        <option value="ms">Master of Science</option>
      </select>
      <label for="major">Major / Field of Study</label>
      <input id="major" name="major" type="text" />
      <label for="gpa">GPA</label>
      <input id="gpa" name="gpa" type="text" placeholder="e.g. 3.75" />
      <label for="grad">Expected Graduation Date</label>
      <input id="grad" name="graduation" type="month" />
    </fieldset>

    <fieldset>
      <legend>Work Eligibility</legend>
      <label>Are you legally authorized to work in the United States? *</label>
      <div class="radio-group">
        <label><input type="radio" name="work_auth" value="yes" /> Yes</label>
        <label><input type="radio" name="work_auth" value="no" /> No</label>
      </div>
      <label>Will you now or in the future require sponsorship for employment visa status?</label>
      <div class="radio-group">
        <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsorship" value="no" /> No</label>
      </div>
      <label for="start">Earliest Available Start Date</label>
      <input id="start" name="start_date" type="date" />
    </fieldset>

    <fieldset>
      <legend>Additional Questions</legend>
      <label for="why">Why do you want to intern at Acme Corp? *</label>
      <textarea id="why" name="why_acme" rows="5" required></textarea>
      <label for="skillsIn">Relevant skills</label>
      <input id="skillsIn" name="skills" type="text" />
      <label for="resume">Resume / CV *</label>
      <input id="resume" name="resume" type="file" />
      <label class="checkline" style="margin-top:14px">
        <input id="agree" name="agree" type="checkbox" required />
        I certify that the information provided is accurate.
      </label>
    </fieldset>

    <button type="button">Submit Application</button>
  </form>
</body>
</html>
